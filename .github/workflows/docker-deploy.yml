# Deploy to the EC2 box.
#
# Manually triggered, never on push, so merging a branch cannot change what is
# running. Pick the image tag to deploy; it defaults to the SHA tag of the commit
# the workflow runs on, which names exactly one build.
#
# The deploy drives the remote Docker daemon over SSH rather than copying files
# to the server: DOCKER_HOST=ssh://target means the runner's compose client
# controls the server's daemon. The compose file and the environment are read on
# the runner and never land on the box.
#
# The edge (nginx-proxy, acme-companion, proxy-net) belongs to
# eudi-srv-wallet-provider. That stack has to be deployed first; this workflow
# checks for it rather than creating it.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha- tag of this commit)'
        required: false
        type: string
      # up -d is a no-op when nothing in the service definition changed, so a
      # redeploy of the same tag does not restart anything.
      force_recreate:
        description: 'Recreate containers even if nothing changed'
        required: false
        default: false
        type: boolean

concurrency:
  # One deploy at a time. Two compose clients against the same daemon would race.
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    env:
      DOCKER_HOST: ssh://target
      COMPOSE: docker compose -f deploy/compose.yaml -p eudiw-verifier

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Resolve the image tag
        id: image
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          if [[ -z "$tag" ]]; then
            tag="sha-${{ github.sha }}"
          fi
          image="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Deploying $image"

      # Authenticated on the runner. The credentials are forwarded to the remote
      # daemon for the pull, so the box needs no registry login of its own.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # config and known_hosts are committed under deploy/ssh/: hostnames, ports
      # and host keys are public data, and keeping them in git makes a change to
      # them reviewable. Only the private key is a secret.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_KEY:-}" ]]; then
            echo "::error::SSH_KEY is not set; see deploy/README.md"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 deploy/ssh/config ~/.ssh/config
          install -m 644 deploy/ssh/known_hosts ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/eudiw-deploy
          chmod 600 ~/.ssh/eudiw-deploy
          ssh -o BatchMode=yes target 'echo "connected to $(hostname)"'

      # proxy-net is created by the wallet provider's stack. Without it compose
      # fails outright, which is at least loud, but failing here names the cause.
      #
      # Nothing else has to pre-exist on the box: the keystore is generated by
      # keystore-init into a named volume on first deploy.
      - name: Preflight
        run: |
          set -euo pipefail
          if docker network inspect proxy-net >/dev/null 2>&1; then
            echo "ok   proxy-net exists"
          else
            echo "::error::proxy-net is missing. Deploy eudi-srv-wallet-provider first."
            exit 1
          fi

      # Compose interpolates ${...} client-side, here on the runner, and sends
      # the daemon an already-expanded spec. So the values only have to exist in
      # this step's environment; nothing is written to disk and nothing lands on
      # the server.
      - name: Pull and roll
        env:
          VERIFIER_IMAGE: ${{ steps.image.outputs.image }}
          VERIFIER_KEYSTORE_PASSWORD: ${{ secrets.VERIFIER_KEYSTORE_PASSWORD }}
          VERIFIER_REGISTRATION_CERTIFICATE: ${{ secrets.VERIFIER_REGISTRATION_CERTIFICATE }}
        run: |
          set -euo pipefail
          for v in VERIFIER_KEYSTORE_PASSWORD VERIFIER_REGISTRATION_CERTIFICATE; do
            if [[ -z "${!v:-}" ]]; then
              echo "::error::$v is not set; see deploy/README.md"
              exit 1
            fi
          done

          export COMPOSE_ENV_FILES=deploy/stack.env

          recreate=""
          [[ "${{ inputs.force_recreate }}" == "true" ]] && recreate="--force-recreate"

          $COMPOSE pull
          $COMPOSE up -d --remove-orphans $recreate

      # A green `up -d` only means compose accepted the configuration. It does
      # not mean the container is still running a moment later, so check.
      - name: Verify
        run: |
          set -uo pipefail
          fail=0

          echo "── container ──"
          state=""
          for _ in $(seq 1 18); do
            state=$(docker inspect -f '{{.State.Status}}' eudiw-verifier 2>/dev/null || echo absent)
            [[ "$state" == "running" ]] && break
            sleep 5
          done
          if [[ "$state" == "running" ]]; then
            echo "  ok   eudiw-verifier"
          else
            echo "  FAIL eudiw-verifier ($state)"
            docker logs --tail 30 eudiw-verifier 2>&1 | sed 's/^/       /' || true
            fail=1
          fi

          echo "── attached to proxy-net ──"
          if docker inspect -f '{{json .NetworkSettings.Networks}}' eudiw-verifier 2>/dev/null | grep -q '"proxy-net"'; then
            echo "  ok"
          else
            echo "  FAIL the proxy cannot reach the service"
            fail=1
          fi

          echo "── nginx config valid ──"
          if docker exec nginx-proxy nginx -t >/dev/null 2>&1; then
            echo "  ok"
          else
            docker exec nginx-proxy nginx -t 2>&1 | sed 's/^/       /'
            fail=1
          fi

          host=$(grep -E '^VERIFIER_HOST=' deploy/stack.env | cut -d= -f2)
          path=$(grep -E '^VERIFIER_PATH=' deploy/stack.env | cut -d= -f2)

          probe() {
            docker run --rm --network proxy-net curlimages/curl:8.11.1 \
              -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -H "Host: $host" "http://nginx-proxy$1" 2>/dev/null || echo 000
          }

          # The JVM needs time before anything answers, so retry rather than
          # failing on the first probe.
          echo "── /wallet routed and the service is up ──"
          code=000
          for _ in $(seq 1 18); do
            code=$(probe "$path/wallet/public-keys.json")
            [[ "$code" == "200" ]] && break
            sleep 5
          done
          if [[ "$code" == "200" ]]; then
            echo "  ok   $path/wallet/public-keys.json returned 200"
          else
            echo "  FAIL $path/wallet/public-keys.json returned $code"
            fail=1
          fi

          # Three separate VIRTUAL_HOST_MULTIPORTS paths, so one working does not
          # prove the others are routed. Both of these are GET routes returning
          # 200, checked against the running image; do not substitute a route
          # that 404s, because that is indistinguishable from nginx not routing.
          echo "── /ui routed ──"
          ui=$(probe "$path/ui/intended-uses")
          if [[ "$ui" == "200" ]]; then
            echo "  ok   $path/ui/intended-uses returned 200"
          else
            echo "  FAIL $path/ui/intended-uses returned $ui"
            fail=1
          fi

          echo "── /utilities routed ──"
          ut=$(probe "$path/utilities/attestationClassifications")
          if [[ "$ut" == "200" ]]; then
            echo "  ok   $path/utilities/attestationClassifications returned 200"
          else
            echo "  FAIL $path/utilities/attestationClassifications returned $ut"
            fail=1
          fi

          # This hostname carries five other services. Adding three more paths
          # must not have shadowed them.
          echo "── siblings still routed ──"
          for p in /wallet-provider/jwks /token_status_list/swagger/; do
            c=$(probe "$p")
            if [[ "$c" == "200" ]]; then
              echo "  ok   $p returned 200"
            else
              echo "  FAIL $p returned $c"
              fail=1
            fi
          done

          [[ "$fail" -eq 0 ]] && echo "deploy verified" || { echo "verification failed"; exit 1; }

      - name: Clean up
        if: always()
        run: docker image prune -f || true
